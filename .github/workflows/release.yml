name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # action-gh-release needs it to create the release

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check tag matches project version
        run: |
          project_version="v$(uv version --short)"
          if [ "$project_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
