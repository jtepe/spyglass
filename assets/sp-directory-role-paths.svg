<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img"
     aria-label="How a service principal can hold a directory role: via direct assignment, via role-assignable group membership, and via PIM — always as an active assignment, never eligible.">
  <style>
    .deep   { fill: #0b3d75; }
    .accent { fill: #0b6bcb; }
    .ring   { fill: #1f2933; }
    .muted  { fill: #62707d; }
    .paper  { fill: #ffffff; }
    .stroke-accent { stroke: #0b6bcb; }
    .stroke-muted  { stroke: #62707d; }
    .stroke-deep   { stroke: #0b3d75; }
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .title  { font-size: 22px; font-weight: 650; }
    .label  { font-size: 16px; font-weight: 600; }
    .sub    { font-size: 12.5px; }
    .tag    { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; }
    @media (prefers-color-scheme: dark) {
      .deep   { fill: #8fbef0; }
      .accent { fill: #3f97ed; }
      .ring   { fill: #c7d2dc; }
      .muted  { fill: #9aa7b3; }
      .paper  { fill: #0d1117; }
      .stroke-accent { stroke: #3f97ed; }
      .stroke-muted  { stroke: #9aa7b3; }
      .stroke-deep   { stroke: #8fbef0; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="accent"/>
    </marker>
  </defs>

  <text class="deep title" x="24" y="38">How a service principal can hold a directory role</text>

  <!-- Service Principal -->
  <rect class="paper stroke-deep" x="24" y="246" width="180" height="78" rx="12" stroke-width="2.5"/>
  <text class="deep label" x="114" y="280" text-anchor="middle">Service</text>
  <text class="deep label" x="114" y="302" text-anchor="middle">Principal</text>
  <text class="muted sub"  x="114" y="338" text-anchor="middle">non-interactive workload identity</text>

  <!-- Connectors: SP -> three mechanisms -->
  <path class="stroke-accent" fill="none" stroke-width="2.5" marker-end="url(#arrow)"
        d="M204 270 C 252 270, 252 130, 298 130"/>
  <path class="stroke-accent" fill="none" stroke-width="2.5" marker-end="url(#arrow)"
        d="M204 285 H 298"/>
  <path class="stroke-accent" fill="none" stroke-width="2.5" marker-end="url(#arrow)"
        d="M204 300 C 252 300, 252 440, 298 440"/>

  <!-- Mechanism 1: Direct assignment -->
  <rect class="paper stroke-accent" x="300" y="92" width="300" height="76" rx="12" stroke-width="2"/>
  <text class="accent tag"  x="318" y="116">DIRECT ASSIGNMENT</text>
  <text class="deep label"  x="318" y="139">Role targets the SP</text>
  <text class="muted sub"   x="318" y="158">source = "direct" · permanent or time-bound</text>

  <!-- Mechanism 2: Group membership -->
  <rect class="paper stroke-accent" x="300" y="247" width="300" height="76" rx="12" stroke-width="2"/>
  <text class="accent tag"  x="318" y="271">GROUP MEMBERSHIP</text>
  <text class="deep label"  x="318" y="294">Role-assignable group</text>
  <text class="muted sub"   x="318" y="313">source = group · transitive membership counts</text>

  <!-- Mechanism 3: PIM (active) -->
  <rect class="paper stroke-accent" x="300" y="402" width="300" height="76" rx="12" stroke-width="2"/>
  <text class="accent tag"  x="318" y="426">PIM — ACTIVE ONLY</text>
  <text class="deep label"  x="318" y="449">Permanent or time-bound</text>
  <text class="muted sub"   x="318" y="468">governs a role or a group membership</text>

  <!-- Connectors: mechanisms -> directory role -->
  <path class="stroke-accent" fill="none" stroke-width="2.5" marker-end="url(#arrow)"
        d="M600 130 C 642 130, 642 268, 670 282"/>
  <path class="stroke-accent" fill="none" stroke-width="2.5" marker-end="url(#arrow)"
        d="M600 285 H 670"/>
  <path class="stroke-accent" fill="none" stroke-width="2.5" marker-end="url(#arrow)"
        d="M600 440 C 642 440, 642 302, 670 288"/>

  <!-- Directory Role (active) -->
  <rect class="accent" x="672" y="244" width="192" height="82" rx="12"/>
  <text class="paper label" x="768" y="276" text-anchor="middle" style="font-size:15px">Directory Role</text>
  <text class="paper tag"   x="768" y="299" text-anchor="middle">assignmentType</text>
  <text class="paper tag"   x="768" y="315" text-anchor="middle">= ACTIVE</text>

  <!-- Eligible: impossible -->
  <rect class="paper stroke-muted" x="24" y="500" width="840" height="46" rx="10"
        stroke-width="2" stroke-dasharray="7 5"/>
  <line class="stroke-muted" x1="40" y1="523" x2="78" y2="523" stroke-width="3"/>
  <line class="stroke-muted" x1="46" y1="513" x2="72" y2="533" stroke-width="3"/>
  <text class="muted label" x="92" y="520">Eligible assignment — not possible for a service principal</text>
  <text class="muted sub"   x="92" y="538">activation needs an interactive sign-in (MFA, justification) a workload identity cannot perform</text>
</svg>
